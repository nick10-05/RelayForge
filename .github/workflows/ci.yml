name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge
          POSTGRES_DB: relayforge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://relayforge:relayforge@localhost:5433/relayforge_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Docker image builds
        run: docker build -t relayforge:ci .
